<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QG.90 | Mapa da Ferramenta</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --fundo:#0E0E0E;--fundo2:#161616;--fundo3:#1E1E1E;
  --laranja:#F28C0F;--texto:#E8E4DC;--texto2:#9A9488;
  --verde:#3DBA7A;--vermelho:#E05252;--azul:#4A9FE0;--roxo:#B57BEE;
  --borda:rgba(232,228,220,.08);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--fundo);color:var(--texto);font-family:'Barlow',sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4,button{font-family:'Barlow Condensed',sans-serif;letter-spacing:.01em;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--borda);border-radius:4px;}

#shell{display:flex;min-height:100vh;}
#sidebar{
  width:300px;flex-shrink:0;background:var(--fundo2);border-right:1px solid var(--borda);
  padding:22px 16px;overflow-y:auto;position:sticky;top:0;height:100vh;
}
.side-logo{font-weight:800;font-size:26px;color:var(--laranja);letter-spacing:1px;margin-bottom:2px;}
.side-sub{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--texto2);margin-bottom:16px;}
.side-search{
  width:100%;background:var(--fundo3);border:1px solid var(--borda);border-radius:8px;
  padding:9px 12px;color:var(--texto);font-size:13px;margin-bottom:16px;font-family:'Barlow',sans-serif;
}
.side-search::placeholder{color:var(--texto2);}
.side-group-label{
  font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--texto2);
  margin:16px 0 6px 10px;font-weight:700;
}
.side-group-label:first-of-type{margin-top:0;}
.step-nav-item{
  display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;
  margin-bottom:2px;transition:background .15s;
}
.step-nav-item:hover{background:var(--fundo3);}
.step-nav-item.active{background:rgba(242,140,15,.12);}
.step-nav-item.hidden{display:none;}
.step-num{
  width:22px;height:22px;border-radius:6px;background:var(--fundo3);color:var(--texto2);
  display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;
  border:1px solid var(--borda);
}
.step-nav-item.active .step-num{background:var(--laranja);color:#0E0E0E;border-color:var(--laranja);}
.step-nav-label{font-size:13.5px;color:var(--texto2);padding-top:2px;line-height:1.3;}
.step-nav-item.active .step-nav-label{color:var(--texto);font-weight:600;}

#main{flex:1;padding:36px 48px;max-width:900px;overflow-y:auto;}
.step-eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--laranja);font-weight:700;margin-bottom:8px;}
.step-title{font-size:34px;font-weight:700;margin-bottom:6px;line-height:1.1;}
.step-sub{color:var(--texto2);font-size:15px;margin-bottom:28px;}

.block{background:var(--fundo2);border:1px solid var(--borda);border-radius:14px;padding:20px 24px;margin-bottom:16px;}
.block h4{font-size:16px;color:var(--laranja);margin-bottom:12px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
.block.expect h4{color:var(--verde);}
.block.warn{border-color:rgba(224,82,82,.4);background:rgba(224,82,82,.06);}
.block.warn h4{color:var(--vermelho);}
.block.tip{border-color:rgba(74,159,224,.4);background:rgba(74,159,224,.06);}
.block.tip h4{color:var(--azul);}

.click-list{list-style:none;counter-reset:click;}
.click-list li{counter-increment:click;position:relative;padding:8px 0 8px 34px;font-size:15px;border-bottom:1px solid var(--borda);}
.click-list li:last-child{border-bottom:none;}
.click-list li::before{
  content:counter(click);position:absolute;left:0;top:8px;
  width:22px;height:22px;background:var(--fundo3);border:1px solid var(--laranja);color:var(--laranja);
  border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
  font-family:'Barlow Condensed',sans-serif;
}
.click-list strong{color:var(--texto);}
.plain-list{list-style:none;padding-left:0;}
.plain-list li{padding:6px 0 6px 20px;font-size:14.5px;border-bottom:1px solid var(--borda);position:relative;}
.plain-list li:last-child{border-bottom:none;}
.plain-list li::before{content:'•';position:absolute;left:0;color:var(--laranja);}
code{background:var(--fundo3);border:1px solid var(--borda);border-radius:5px;padding:2px 7px;font-family:monospace;font-size:13.5px;color:var(--laranja);}
.fill-table{width:100%;border-collapse:collapse;margin-top:4px;}
.fill-table td{padding:8px 0;font-size:14.5px;border-bottom:1px solid var(--borda);}
.fill-table td:first-child{color:var(--texto2);width:38%;}
.fill-table tr:last-child td{border-bottom:none;}
.quote-line{font-style:italic;color:var(--texto2);border-left:2px solid var(--laranja);padding:8px 14px;margin-top:10px;font-size:14px;}

.step-footer{display:flex;justify-content:space-between;margin-top:30px;padding-bottom:60px;}
.nav-btn{background:var(--fundo3);border:1px solid var(--borda);color:var(--texto);padding:12px 22px;border-radius:9px;font-family:'Barlow',sans-serif;font-weight:600;font-size:14.5px;cursor:pointer;transition:.15s;}
.nav-btn:hover{border-color:var(--laranja);}
.nav-btn.primary{background:var(--laranja);color:#0E0E0E;border-color:var(--laranja);}
.nav-btn.primary:hover{background:#ff9d2e;}
.nav-btn:disabled{opacity:.3;cursor:default;}

.ref-table{width:100%;border-collapse:collapse;margin-top:8px;}
.ref-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--texto2);padding:8px 10px;border-bottom:1px solid var(--borda);font-weight:700;}
.ref-table td{padding:11px 10px;border-bottom:1px solid var(--borda);font-size:14px;}

.mod-badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
.mod-roi{background:rgba(255,107,0,.15);color:var(--laranja);}
.mod-camp{background:rgba(181,123,238,.15);color:var(--roxo);}
.mod-exp{background:rgba(74,159,224,.15);color:var(--azul);}
.mod-scripts{background:rgba(61,186,122,.15);color:var(--verde);}
.mod-geral{background:rgba(154,148,136,.15);color:var(--texto2);}

@media(max-width:860px){
  #shell{flex-direction:column;}
  #sidebar{width:100%;height:auto;position:relative;max-height:none;}
  #main{padding:24px 18px;}
  .step-title{font-size:26px;}
}
</style>
</head>
<body>

<div id="shell">
  <nav id="sidebar">
    <div class="side-logo">QG<span style="color:var(--texto)">.90</span></div>
    <div class="side-sub">Mapa da Ferramenta</div>
    <input class="side-search" id="sideSearch" placeholder="🔍 Buscar um tema..." oninput="filtrarNav(this.value)">
    <div id="stepNavList"></div>
  </nav>

  <main id="main"></main>
</div>

let current = 0;
let filtro = '';

function renderSidebar(){
  const el = document.getElementById('stepNavList');
  let html = '';
  let grupoAtual = null;
  steps.forEach((s,i)=>{
    const bate = !filtro || (s.title+' '+s.sub+' '+s.grupo).toLowerCase().includes(filtro);
    if(s.grupo!==grupoAtual){
      grupoAtual=s.grupo;
      html += `<div class="side-group-label">${grupoAtual}</div>`;
    }
    html += `<div class="step-nav-item ${i===current?'active':''} ${bate?'':'hidden'}" onclick="goTo(${i})">
      <div class="step-num">${s.eyebrow==='Comece por aqui'?'★':'·'}</div>
      <div class="step-nav-label">${s.title}</div>
    </div>`;
  });
  el.innerHTML = html;
}
function filtrarNav(v){ filtro = v.trim().toLowerCase(); renderSidebar(); }

function blockHtml(b){
  if(b.type==='click'){
    return `<div class="block"><h4>▸ ${b.title}</h4><ul class="click-list">${b.items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`;
  }
  if(b.type==='expect'){
    return `<div class="block expect"><h4>✓ ${b.title}</h4><div>${b.text}</div></div>`;
  }
  if(b.type==='warn'){
    return `<div class="block warn"><h4>⚠ ${b.title}</h4><div>${b.text}</div></div>`;
  }
  if(b.type==='tip'){
    return `<div class="block tip"><h4>💡 ${b.title}</h4><div class="quote-line">${b.text}</div></div>`;
  }
  if(b.type==='fill'){
    return `<div class="block"><h4>✎ ${b.title}</h4><table class="fill-table">${b.rows.map(r=>`<tr><td>${r[0]}</td><td><strong>${r[1]}</strong></td></tr>`).join('')}</table></div>`;
  }
  if(b.type==='reftable'){
    return `<div class="block"><h4>${b.title}</h4><table class="ref-table"><tr>${b.headers.map(h=>`<th>${h}</th>`).join('')}</tr>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
  }
  return '';
}

function renderMain(){
  const s = steps[current];
  const el = document.getElementById('main');
  el.innerHTML = `
    <span class="mod-badge ${s.badge}">${s.grupo}</span>
    <div class="step-eyebrow">${s.eyebrow}</div>
    <div class="step-title">${s.title}</div>
    <div class="step-sub">${s.sub}</div>
    ${s.blocks.map(blockHtml).join('')}
    <div class="step-footer">
      <button class="nav-btn" onclick="goTo(${current-1})" ${current===0?'disabled':''}>← Anterior</button>
      <button class="nav-btn primary" onclick="goTo(${current+1})" ${current===steps.length-1?'disabled':''}>Próximo →</button>
    </div>
  `;
  window.scrollTo(0,0);
  el.scrollTop = 0;
}

function goTo(i){
  if(i<0||i>=steps.length) return;
  current = i;
  renderSidebar();
  renderMain();
}

renderSidebar();
renderMain();

document.addEventListener('keydown', e=>{
  if(document.activeElement===document.getElementById('sideSearch'))return;
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});
</script>
